
name: Crear EXE para Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Crear ejecutable
        run: |
          python -m PyInstaller --onefile --windowed --name La_Huertita_Pura_Vida --add-data "plantilla.pdf;." main.py

      - name: Guardar ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: La_Huertita_Pura_Vida_Windows
          path: dist/La_Huertita_Pura_Vida.exe
